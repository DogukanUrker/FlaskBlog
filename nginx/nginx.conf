events {
    worker_connections  1024;
}

http {
    server {
        listen 80;

        # Frontend routes
        location / {
            # uwsgi_pass  localhost:1283;
            # root /var/www/html;
        }

        # Health check endpoint
        location /health {
            index /usr/share/nginx/html/health.html;
        }
    }
}