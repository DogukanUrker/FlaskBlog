events {
    worker_connections  1024;
}

http {
    server {
        listen 80;

        location /health {
            return 200;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://businesscorp.com:80/;   
        }
    }
}