[project]
name = "flaskBlog"
version = "3.0.0dev"
authors = [{ name = "Doğukan Ürker", email = "dogukanurker@icloud.com" }]
description = "Blog application built with Flask"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tamga==1.4.0",
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "flask-wtf==1.3.0",
    "passlib==1.7.4",
    "wtforms==3.2.2",
    "markdown2==2.5.5",
    "bleach==6.4.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-playwright==0.8.0",
    "pytest-xdist==3.8.0",
    "filelock==3.32.2",
    "playwright==1.60.0",
]
dev = [
    "ruff==0.15.20",
]
